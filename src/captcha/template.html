<!doctype html>
<html>
  <body style="margin: 0">
    <div style="max-width: max-content" id="turnstile-widget"></div>

    <script>
      const ws = new WebSocket(`ws://${window.c_hostname}:1490/callback`);

      ws.onopen = () => {
        console.log("socket opened, loading captcha script...");

        const script = document.createElement("script");
        script.src =
          "https://smartcaptcha.cloud.yandex.ru/captcha.js?render=onload&onload=onloadFunction";

        document.body.appendChild(script);
      };

      function onloadFunction() {
        if (!window.smartCaptcha) return;

        const container = document.getElementById("turnstile-widget");

        const widgetId = window.smartCaptcha.render(container, {
          sitekey: window.sitekey,
          hl: "ru",
          callback: (token) => {
            ws.send(JSON.stringify({ event: "CALLBACK", token }));
          },
        });

        setTimeout(() => ws.send(JSON.stringify({ event: "READY" })), 5_500);
      }
    </script>
  </body>
</html>
