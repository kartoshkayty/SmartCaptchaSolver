<!doctype html>
<html>
  <body style="margin: 0">
    <div id="popa" style="max-width: max-content">
      <!-- <cap-widget
        id="cap"
        data-cap-api-endpoint="https://cap.millida.org/09c07b9af6/"
      ></cap-widget> -->
    </div>

    <script>
      const ws = new WebSocket(`ws://${window.c_hostname}:1490/callback`);

      ws.onopen = () => {
        console.log("socket opened, loading captcha script...");

        const popaContainer = document.getElementById("popa");
        const widget = document.createElement("cap-widget");
        widget.setAttribute("id", "cap");
        widget.setAttribute(
          "data-cap-api-endpoint",
          `https://cap.millida.org/${window.sitekey}/`,
        );

        popaContainer.appendChild(widget);

        const script = document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/npm/@cap.js/widget";

        script.onload = () => {
          setTimeout(() => ready(), 5_500);
        };

        document.body.appendChild(script);
      };

      function ready() {
        ws.send(JSON.stringify({ event: "READY" }));

        const capWidget = document.getElementById("cap");
        capWidget.addEventListener("solve", (e) => {
          ws.send(JSON.stringify({ event: "CALLBACK", token: e.detail.token }));
        });
      }
    </script>
  </body>
</html>
