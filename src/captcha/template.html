<!doctype html>
<html>
  <body style="margin: 0">
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=_turnstileCb"
      async
      defer
    ></script>

    <div style="max-width: max-content" id="turnstile-widget"></div>

    <script>
      async function _turnstileCb() {
        turnstile.render("#turnstile-widget", {
          sitekey: window.sitekey,
          theme: "dark",
          callback: async function (token) {
            document.documentElement.setAttribute("captcha-data", token);
          },
        });
      }
    </script>
  </body>
</html>
